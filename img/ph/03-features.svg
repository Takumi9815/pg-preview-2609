<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="3600" viewBox="0 0 1500 3600">
  <rect width="1500" height="3600" fill="#f3f5f9"/>
  <rect x="20" y="20" width="1460" height="3560" fill="none" stroke="#b9c3d6" stroke-width="6" stroke-dasharray="24 16"/>
  <text x="750" y="110" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" fill="#6b7590">④ 特徴画像（1500×3600）ここに生成画像 img/03-features.png</text>
  <g font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle" fill="#111">
    <text x="750" y="290" font-size="64" font-weight="700" fill="#0b2a62">プチゴル つくば店の</text>
    <text x="750" y="440" font-size="110" font-weight="900">おすすめポイント<tspan fill="#a50a12">8</tspan>選</text>
  </g>
  <rect x="0" y="540" width="1500" height="900" fill="#d5dbe6"/>
  <text x="750" y="980" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="56" fill="#6b7590">施設イメージ（FVとは別カット／人物なし）</text>
  <text x="750" y="1060" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" fill="#6b7590">※イメージ</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <!-- POINT 1 -->
    <rect x="100" y="1520" width="1300" height="210" rx="20" fill="#fff" stroke="#dfe5f0" stroke-width="3"/>
    <rect x="100" y="1520" width="230" height="210" rx="20" fill="#0b2a62"/>
    <text x="215" y="1608" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">POINT</text>
    <text x="215" y="1680" text-anchor="middle" font-size="66" font-weight="900" fill="#fff">1</text>
    <text x="370" y="1602" font-size="50" font-weight="900" fill="#111">朝5時〜24時、年中無休</text>
    <text x="370" y="1657" font-size="30" fill="#555">出勤前も仕事帰りも、好きな時間に。</text>
    <text x="370" y="1700" font-size="30" fill="#555">1コマ60分の予約制で、待たずに打てます。</text>

    <!-- POINT 2 -->
    <rect x="100" y="1770" width="1300" height="210" rx="20" fill="#fff" stroke="#dfe5f0" stroke-width="3"/>
    <rect x="100" y="1770" width="230" height="210" rx="20" fill="#0b2a62"/>
    <text x="215" y="1858" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">POINT</text>
    <text x="215" y="1930" text-anchor="middle" font-size="66" font-weight="900" fill="#fff">2</text>
    <text x="370" y="1852" font-size="50" font-weight="900" fill="#111">つくばエリア最安級 <tspan fill="#a50a12">月々4,400円〜</tspan></text>
    <text x="370" y="1907" font-size="30" fill="#555">通いやすい月額定額制（税込）。</text>

    <!-- POINT 3 -->
    <rect x="100" y="2020" width="1300" height="210" rx="20" fill="#fff" stroke="#dfe5f0" stroke-width="3"/>
    <rect x="100" y="2020" width="230" height="210" rx="20" fill="#0b2a62"/>
    <text x="215" y="2108" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">POINT</text>
    <text x="215" y="2180" text-anchor="middle" font-size="66" font-weight="900" fill="#fff">3</text>
    <text x="370" y="2102" font-size="50" font-weight="900" fill="#111">全5打席。プライベートな個室も</text>
    <text x="370" y="2157" font-size="30" fill="#555">個室2打席は同伴OK（最大3名）。</text>
    <text x="370" y="2200" font-size="30" fill="#555">オープン3打席は、ひとり練習に気軽に。</text>

    <!-- POINT 4 -->
    <rect x="100" y="2270" width="1300" height="210" rx="20" fill="#fff" stroke="#dfe5f0" stroke-width="3"/>
    <rect x="100" y="2270" width="230" height="210" rx="20" fill="#0b2a62"/>
    <text x="215" y="2358" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">POINT</text>
    <text x="215" y="2430" text-anchor="middle" font-size="66" font-weight="900" fill="#fff">4</text>
    <text x="370" y="2352" font-size="50" font-weight="900" fill="#111">高性能シミュレーター完備</text>
    <text x="370" y="2407" font-size="30" fill="#555">全5打席に同一機種の最新シミュレーター。</text>
    <text x="370" y="2450" font-size="30" fill="#555">弾道データとスイング動画をもとに、効率よく上達。</text>

    <!-- POINT 5 -->
    <rect x="100" y="2520" width="1300" height="210" rx="20" fill="#fff" stroke="#dfe5f0" stroke-width="3"/>
    <rect x="100" y="2520" width="230" height="210" rx="20" fill="#0b2a62"/>
    <text x="215" y="2608" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">POINT</text>
    <text x="215" y="2680" text-anchor="middle" font-size="66" font-weight="900" fill="#fff">5</text>
    <text x="370" y="2602" font-size="50" font-weight="900" fill="#111">国内外240コース以上でラウンド</text>
    <text x="370" y="2657" font-size="30" fill="#555">コースやホールを選べるフィールド練習、ミニゲームも。</text>
    <text x="370" y="2700" font-size="30" fill="#555">家族や仲間を呼んで、一緒に楽しめます。</text>

    <!-- POINT 6 -->
    <rect x="100" y="2770" width="1300" height="210" rx="20" fill="#fff" stroke="#dfe5f0" stroke-width="3"/>
    <rect x="100" y="2770" width="230" height="210" rx="20" fill="#0b2a62"/>
    <text x="215" y="2858" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">POINT</text>
    <text x="215" y="2930" text-anchor="middle" font-size="66" font-weight="900" fill="#fff">6</text>
    <text x="370" y="2852" font-size="50" font-weight="900" fill="#111">プロのレッスンも受けられる</text>
    <text x="370" y="2907" font-size="30" fill="#555">レッスンプロが常駐する時間帯に、</text>
    <text x="370" y="2950" font-size="30" fill="#555">ワンポイントレッスンを実施予定。</text>

    <!-- POINT 7 -->
    <rect x="100" y="3020" width="1300" height="210" rx="20" fill="#fff" stroke="#dfe5f0" stroke-width="3"/>
    <rect x="100" y="3020" width="230" height="210" rx="20" fill="#0b2a62"/>
    <text x="215" y="3108" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">POINT</text>
    <text x="215" y="3180" text-anchor="middle" font-size="66" font-weight="900" fill="#fff">7</text>
    <text x="370" y="3102" font-size="50" font-weight="900" fill="#111">手ぶらでOK</text>
    <text x="370" y="3157" font-size="30" fill="#555">クラブ（メンズ・レディース・ジュニア）と</text>
    <text x="370" y="3200" font-size="30" fill="#555">グローブを無料でお貸しします。</text>

    <!-- POINT 8 -->
    <rect x="100" y="3270" width="1300" height="210" rx="20" fill="#fff" stroke="#dfe5f0" stroke-width="3"/>
    <rect x="100" y="3270" width="230" height="210" rx="20" fill="#0b2a62"/>
    <text x="215" y="3358" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">POINT</text>
    <text x="215" y="3430" text-anchor="middle" font-size="66" font-weight="900" fill="#fff">8</text>
    <text x="370" y="3352" font-size="50" font-weight="900" fill="#111">ソファでくつろげるラウンジ</text>
    <text x="370" y="3407" font-size="30" fill="#555">コーヒー・紅茶・日本茶などを無料でご用意（予定）。</text>
    <text x="370" y="3450" font-size="30" fill="#555">ゲスト用Wi-Fi、ロッカー（大・小／有料）も。</text>
  </g>
</svg>
